# .github/workflows/ligas.yml
#
# VaVerde — predicciones de ligas de clubes
# ==========================================
# Workflow SEPARADO del torneo a propósito: si esto falla, las
# selecciones no se enteran, y viceversa.
#
# football-data.co.uk actualiza resultados ~2x/semana (noches de domingo
# y miércoles, hora UK). Corremos lunes y jueves en la madrugada CDMX
# para levantar lo fresco, + disparo manual cuando quieras.
name: Actualizar ligas
on:
  schedule:
    - cron: "13 12 * * 1,4"   # 6:13 AM CDMX lunes y jueves
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  ligas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install --quiet pandas scipy numpy scikit-learn
      - name: Generar predicciones Liga MX
        run: python leagues/generate_league.py ligamx
      - name: Generar predicciones Brasileirao
        run: python leagues/generate_league.py bra
      - name: Generar predicciones Primeira Liga
        run: python leagues/generate_league.py primeira
      - name: Generar predicciones Eredivisie
        run: python leagues/generate_league.py eredivisie
      - name: Generar predicciones LaLiga
        run: python leagues/generate_league.py laliga
      - name: Generar predicciones Premier League
        run: python leagues/generate_league.py premier
      - name: Generar predicciones Serie A
        run: python leagues/generate_league.py seriea
      - name: Generar predicciones Ligue 1
        run: python leagues/generate_league.py ligue1
      - name: Generar predicciones Bundesliga
        run: python leagues/generate_league.py bundesliga
      - name: Publicar en /docs (GitHub Pages)
        run: |
          git config user.name "vaverde-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/leagues leagues/history_ligamx.json leagues/pending_ligamx.json leagues/history_bra.json leagues/pending_bra.json leagues/history_primeira.json leagues/pending_primeira.json leagues/history_eredivisie.json leagues/pending_eredivisie.json leagues/history_laliga.json leagues/pending_laliga.json leagues/history_premier.json leagues/pending_premier.json leagues/history_seriea.json leagues/pending_seriea.json leagues/history_ligue1.json leagues/pending_ligue1.json leagues/history_bundesliga.json leagues/pending_bundesliga.json
          git commit -m "Ligas $(date -u +%Y-%m-%d)" || echo "Sin cambios que publicar"
          # El bot del torneo también pushea a main: rebase antes de empujar
          git pull --rebase origin main
          git push
