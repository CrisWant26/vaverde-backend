# .github/workflows/predicciones.yml
#
# VaVerde — actualización diaria de predicciones
# ================================================
# Corre cada madrugada: baja el dataset actualizado, re-entrena el
# Dixon-Coles y publica predictions.json en /docs (servido por GitHub Pages).
#
# También se puede disparar a mano: pestaña Actions -> este workflow -> Run workflow.

name: Actualizar predicciones

on:
  schedule:
    - cron: "13 12 * * *"   # 6:13 AM CDMX — predicciones del día
    - cron: "37 21 * * *"   # 3:37 PM CDMX — captura bloque matutino
    - cron: "43 1 * * *"    # 7:43 PM CDMX — captura bloque de tarde
    - cron: "27 6 * * *"    # 12:27 AM CDMX — cierre del día completo
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  predecir:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install --quiet pandas scipy numpy scikit-learn

      - name: Dataset actualizado
        run: curl -sL -o results.csv https://raw.githubusercontent.com/martj42/international_results/master/results.csv

      - name: Generar predicciones
        run: python generate_predictions.py

      - name: Publicar en /docs (GitHub Pages)
        run: |
          mkdir -p docs
          cp predictions.json docs/predictions.json
          git config user.name "vaverde-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/predictions.json history.json pending_predictions.json
          git commit -m "Predicciones $(date -u +%Y-%m-%d)" || echo "Sin cambios que publicar"
          git push
